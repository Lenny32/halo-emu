# Halo desktop emulator — native_sim config fragment.
#
# Merged immediately after the app's prj.conf via
#   -DCONF_FILE="<app>/prj.conf;<this file>"
# (emulator/build.sh does this; the app's own CMakeLists force-caches
# EXTRA_CONF_FILE=debug.conf, which still appends afterwards). The firmware
# tree is not modified: this file only overrides.
#
# Shared by native_sim and native_sim_64 (build.sh passes it for both).

CONFIG_HALO_EMULATOR=y

# Name the final executable halo-emu.exe instead of Zephyr's default
# zephyr.exe (build.sh symlinks it to build/halo-emu).
CONFIG_KERNEL_BIN_NAME="halo-emu"

# native_sim defaults to immediate-mode logging; keep the deferred mode +
# processing thread the hardware build uses (prj.conf tunes its buffers).
CONFIG_LOG_MODE_DEFERRED=y

# BLE: the Alif ROM BLE host stack cannot run off-silicon. Phase 1 replaces
# the transport with a TCP socket (CONFIG_HALO_TRANSPORT_TCP, default y; the
# module re-declares HALO_BLE_LUA_SERVICE so prj.conf's =y keeps the Lua
# runtime alive); real BLE via Zephyr's BT stack is phase 2 (tickets 0018+).
CONFIG_HALO_BLE_MANAGER=n
CONFIG_HALO_BLE_OTA_SERVICE=n
CONFIG_HALO_BLE_AUDIO_SERVICE=n
CONFIG_HALO_BLE_AUDIO_SINK_ENABLE=n
CONFIG_HALO_BLE_AUDIO_OUTPUT_STEREO=n
CONFIG_HALO_BLE_AUDIO_SOURCE_ENABLE=n
CONFIG_HALO_BLE_ANCS_CLIENT=n
CONFIG_HALO_SE_MGMT=n
CONFIG_HALO_BLE_BOND_STORAGE=n
CONFIG_HALO_BLE_REQUIRE_PAIRING=n

# Ship mode: the emulator module's shutdown_emu.c claims the sm-gpio
# compatible (alias added in native_sim.overlay) and exits the process; the
# real driver must stay out — both define the global shutdown() and the DT
# device instance.
CONFIG_SM_GPIO=n

# pm_manager failsafes and the VM-reset path call sys_reboot(); the POSIX
# arch has no sys_arch_reboot, so the emulator module supplies one that
# exits the process (misc_stubs.c).
CONFIG_REBOOT=y

# No hardware watchdog on the host
CONFIG_HALO_WATCHDOG_MANAGER=n
CONFIG_HALO_WATCHDOG_ALLOW_CALLBACK=n
CONFIG_HALO_WATCHDOG_AUTO_FEED=n

# AEC comes back on host in ticket 0015
CONFIG_HALO_AUDIO_AEC=n

# Audio: audio_stream.c hard-includes the Alif ROM LC3 codec and the T5838
# AAD registers — ticket 0014 compiles an alternate host backend for the
# whole halo/audio_stream.h contract instead. Off until then (takes
# lua_speaker/lua_sound/lua_microphone with it, see modules/halo CMake).
CONFIG_HALO_AUDIO_STREAM=n

# LED: led_manager needs a pwm_leds device; Zephyr 3.6 has no PWM emulator.
# Ticket 0013 ships a fake LED driver and turns this back on.
CONFIG_HALO_LED_MANAGER=n

# Sounds need the hardware speaker (audio: ticket 0014)
CONFIG_HALO_SFXR=n
CONFIG_HALO_LUA_SOUND=n
CONFIG_HALO_STARTUP_SOUND=n
CONFIG_HALO_SHUTDOWN_SOUND=n

# Host memory: one big internal heap, no external SRAM window
CONFIG_HALO_MEM_USE_EXTERNAL_SRAM=n
CONFIG_HALO_MEM_INTERNAL_SIZE=4194304

# Cortex-M / driver-specific bits from prj.conf that do not exist on posix
CONFIG_MPU_ALLOW_FLASH_WRITE=n
CONFIG_MPIX_LOG_LEVEL_WRN=n
CONFIG_LED_PWM=n

# Display (ticket 0007): the module's HALO_EMU_DISPLAY (default y) injects
# the CONFIG_CDC200 macro so lua_display.c's full canvas path compiles, and
# display_fake.c supplies the cdc200/vga020 entry points over a host
# framebuffer. Presenting that buffer in the SDL window is ticket 0008; the
# SDL device is chosen zephyr,panel, giving blanking a real target already.
# Canvas is pure software (fonts + blitting; sizes from chosen
# zephyr,display) — on hardware the halo board defconfig enables it, which
# native_sim does not inherit.
CONFIG_DISPLAY=y
CONFIG_SDL_DISPLAY=y
CONFIG_CANVAS=y
# Software renderer: the accelerated one fails under SDL_VIDEODRIVER=dummy
# (headless/CI runs), which left the sdl_dc device not-ready and took the
# whole display path down. Full-frame blits of a 256x256 panel don't need
# GPU help.
CONFIG_SDL_DISPLAY_USE_HARDWARE_ACCELERATOR=n

# Boot splash (module Kconfig re-declares HALO_BOOT_LOGO without the CDC200
# dependency): draws into the fake framebuffer before the Lua runtime
# starts, exercising init/resume/draw/suspend at every boot. Hold times are
# the hardware defaults — boot (and the REPL) is ~3 s late, exactly like a
# real unit.
CONFIG_HALO_BOOT_LOGO=y

# Button: the repo's own gpio-button driver runs unmodified on the emulated
# GPIO controller (node + sw0 alias in native_sim.overlay; injection comes
# with tickets 0009/0010). These are board-defconfig symbols on halo.
CONFIG_GPIO=y
CONFIG_INPUT=y

# Storage: flash simulator backing /lfs (ticket 0004). FLASH / FLASH_MAP /
# FILE_SYSTEM(_LITTLEFS) already come from prj.conf + modules/halo Kconfig
# selects; the overlay reshapes flash0 to MRAM geometry and a 128 KB
# storage_partition. Persistence is file-backed BY DEFAULT: the simulator
# mmaps ./flash.bin (created on first run) unless --flash=<path> renames it,
# --flash_erase blanks it, or --flash_in_ram makes the run throwaway.
CONFIG_FLASH_SIMULATOR=y

# Console/logging go to stdout via the native_sim UART defaults.
