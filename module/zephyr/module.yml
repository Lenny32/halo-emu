# Out-of-tree Zephyr module for the Halo desktop emulator.
# Activated per-build with -DZEPHYR_EXTRA_MODULES=<repo>/emulator/module
# (see emulator/build.sh); hardware builds never load it.
name: halo_emulator
build:
  cmake: .
  kconfig: Kconfig
  settings:
    # Bindings for the emulator's fake devices (module/dts/bindings/)
    dts_root: .
