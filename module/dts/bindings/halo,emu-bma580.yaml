description: |
  Emulated BMA580 accelerometer (module/src/fake_sensors.c), wired as chosen
  zephyr,accel for lua_imu.c. Reports a fixed level-orientation gravity
  vector and swallows the BMA580-private attributes until ticket 0012 adds
  settable vectors and tap injection.

compatible: "halo,emu-bma580"

include: sensor-device.yaml
